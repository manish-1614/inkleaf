<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 8px;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #diagram {
            width: 100%;
            height: auto;
            max-width: 100%;
        }
        .error {
            color: #EF4444;
            font-family: monospace;
            font-size: 12px;
            padding: 8px;
            border: 1px solid #FCA5A5;
            background-color: #FEF2F2;
            border-radius: 4px;
        }
    </style>
    <!-- Local vendor script placeholder for Mermaid.js -->
    <script src="mermaid.min.js"></script>
    <script>
        async function renderMermaid(code, theme) {
            const element = document.getElementById('diagram');
            try {
                const config = {
                    startOnLoad: false,
                    theme: theme === 'dark' ? 'dark' : (theme === 'sepia' ? 'forest' : 'default'),
                    securityLevel: 'strict'
                };
                mermaid.initialize(config);

                if (typeof mermaid.render === 'function') {
                    const result = await mermaid.render('mermaid-svg-' + Math.floor(Math.random() * 10000), code);
                    const svgCode = typeof result === 'string' ? result : (result.svg || '');
                    element.innerHTML = svgCode;
                    if (window.AndroidBridge) {
                        window.AndroidBridge.onRenderSuccess(element.scrollWidth, element.scrollHeight || 200);
                    }
                } else {
                    throw new Error("Mermaid render method unavailable");
                }
            } catch (err) {
                const errorMsg = err && err.message ? err.message : String(err);
                element.innerHTML = '<div class="error">Failed to parse Mermaid diagram:<br>' + errorMsg + '</div>';
                if (window.AndroidBridge) {
                    window.AndroidBridge.onRenderError(errorMsg);
                }
            }
        }
    </script>
</head>
<body>
    <div id="diagram">
        <div style="font-family: sans-serif; font-size: 13px; color: #64748B;">Rendering diagram...</div>
    </div>
</body>
</html>
