<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
        }
        body {
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        #diagram {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            text-align: center;
        }
        #diagram svg {
            max-width: 100% !important;
            max-height: 100% !important;
            height: auto !important;
            width: auto !important;
        }
        .error {
            color: #EF4444;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border: 1px solid #FCA5A5;
            background-color: #FEF2F2;
            border-radius: 6px;
            text-align: left;
            max-width: 90%;
            word-break: break-word;
        }
    </style>
    <script>
        // 1. Critical Polyfill: structuredClone (missing in Android WebViews older than Chrome 98)
        if (typeof window.structuredClone !== 'function') {
            window.structuredClone = function(obj) {
                if (obj === undefined) return undefined;
                if (obj === null) return null;
                if (typeof obj !== 'object') return obj;
                try {
                    return JSON.parse(JSON.stringify(obj));
                } catch (e) {
                    if (Array.isArray(obj)) return obj.slice();
                    return Object.assign({}, obj);
                }
            };
        }

        // 2. Global error listener to immediately capture and report any initialization or syntax errors
        window.addEventListener('error', function(event) {
            var msg = event.message || (event.error && event.error.message) || String(event);
            var file = event.filename || '';
            var line = event.lineno || 0;
            console.error("Mermaid Host Error: " + msg + " at " + file + ":" + line);
            if (window.AndroidBridge && typeof window.AndroidBridge.onRenderError === 'function') {
                window.AndroidBridge.onRenderError("Script error in " + file + " (line " + line + "): " + msg);
            }
        }, true);
    </script>
    <script src="mermaid.min.js" onerror="if(window.AndroidBridge && typeof window.AndroidBridge.onRenderError === 'function') window.AndroidBridge.onRenderError('Failed to load mermaid.min.js asset file. Check asset permissions.');"></script>
    <script>
        function decodeBase64Utf8(base64) {
            const binString = atob(base64);
            const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
            return new TextDecoder().decode(bytes);
        }

        function getMermaidInstance() {
            const raw = window.mermaid || (typeof mermaid !== 'undefined' ? mermaid : null);
            if (!raw) return null;
            return raw.default || raw;
        }

        function waitForMermaid(timeoutMs = 10000) {
            return new Promise((resolve, reject) => {
                const start = Date.now();
                function check() {
                    const m = getMermaidInstance();
                    if (m && typeof m.render === 'function') {
                        resolve(m);
                    } else if (Date.now() - start > timeoutMs) {
                        reject(new Error("Mermaid library failed to load within " + timeoutMs + "ms"));
                    } else {
                        setTimeout(check, 50);
                    }
                }
                check();
            });
        }

        let isRendering = false;

        async function renderMermaidBase64(base64Code, theme) {
            if (isRendering) {
                console.log("Render already in progress, queuing wait...");
                await new Promise(r => setTimeout(r, 100));
            }
            isRendering = true;
            try {
                const code = decodeBase64Utf8(base64Code);
                await renderMermaid(code, theme);
            } catch (err) {
                const errorMsg = err && err.message ? err.message : String(err);
                const element = document.getElementById('diagram');
                if (element) {
                    element.innerHTML = '<div class="error">Failed to decode diagram source:<br>' + errorMsg + '</div>';
                }
                if (window.AndroidBridge && typeof window.AndroidBridge.onRenderError === 'function') {
                    window.AndroidBridge.onRenderError(errorMsg);
                }
            } finally {
                isRendering = false;
            }
        }

        async function renderMermaid(code, theme) {
            const element = document.getElementById('diagram');
            try {
                const mermaidObj = await waitForMermaid(10000);

                const resolvedTheme = (theme === 'dark') ? 'dark' : ((theme === 'sepia' || theme === 'paper') ? 'forest' : 'default');

                const config = {
                    startOnLoad: false,
                    theme: resolvedTheme,
                    securityLevel: 'strict'
                };
                mermaidObj.initialize(config);

                const svgId = 'mermaid_svg_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
                const result = await mermaidObj.render(svgId, code);
                const svgCode = typeof result === 'string' ? result : (result.svg || '');
                element.innerHTML = svgCode;

                // Ensure DOM reflow pass has occurred before measuring bounding rect
                await new Promise((resolve) => setTimeout(resolve, 40));

                const svgElement = element.querySelector('svg');
                let measuredWidth = element.scrollWidth;
                let measuredHeight = element.scrollHeight || 200;

                if (svgElement) {
                    const rect = svgElement.getBoundingClientRect();
                    if (rect.height > 10) {
                        measuredHeight = Math.ceil(rect.height);
                    }
                    if (rect.width > 10) {
                        measuredWidth = Math.ceil(rect.width);
                    }
                }

                if (window.AndroidBridge) {
                    if (typeof window.AndroidBridge.onRenderSuccess === 'function') {
                        window.AndroidBridge.onRenderSuccess(measuredWidth, measuredHeight);
                    }
                    if (typeof window.AndroidBridge.onSvgGenerated === 'function') {
                        window.AndroidBridge.onSvgGenerated(svgCode, measuredWidth, measuredHeight);
                    }
                }
            } catch (err) {
                const errorMsg = err && err.message ? err.message : String(err);
                element.innerHTML = '<div class="error">Failed to parse Mermaid diagram:<br>' + errorMsg + '</div>';
                if (window.AndroidBridge && typeof window.AndroidBridge.onRenderError === 'function') {
                    window.AndroidBridge.onRenderError(errorMsg);
                }
            }
        }

        function notifyPageReady() {
            if (window.AndroidBridge && typeof window.AndroidBridge.onPageReady === 'function') {
                window.AndroidBridge.onPageReady();
            }
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            notifyPageReady();
        } else {
            window.addEventListener('DOMContentLoaded', notifyPageReady);
        }
    </script>
</head>
<body>
    <div id="diagram">
        <div style="font-family: sans-serif; font-size: 13px; color: #64748B;">Rendering diagram...</div>
    </div>
</body>
</html>
